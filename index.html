  );
}
const inp = { width: "100%", padding: "9px 11px", border: `1px solid ${C.line}`, borderRadius: 8, fontSize: 13, background: "#fff", color: C.ink, outline: "none" };

// Date field with native calendar picker. Stores/shows Buddhist era (พ.ศ.) but picker works in CE.
// ตัวเลือกวันที่แบบ พ.ศ. ล้วน (วัน/เดือน/ปี พ.ศ. แยก 3 ช่อง) — ไม่ใช้ <input type="date"> ของเบราว์เซอร์
// เพราะตัวเลือกวันที่ของเบราว์เซอร์แสดงผลเป็น ค.ศ. เสมอ ไม่ขึ้นกับ locale ของระบบปฏิบัติการ
function DateInput({ value, onChange }) {
  const parse = (v) => (v && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v.split("-") : ["", "", ""]);
  const [y, setY] = useState(parse(value)[0]);
  const [mo, setMo] = useState(parse(value)[1]);
  const [d, setD] = useState(parse(value)[2]);
  useEffect(() => { const [py, pmo, pd] = parse(value); setY(py); setMo(pmo); setD(pd); }, [value]);
  const commit = (ny, nmo, nd) => {
    setY(ny); setMo(nmo); setD(nd);
    if (ny && nmo && nd) onChange(`${String(ny).padStart(4, "0")}-${String(nmo).padStart(2, "0")}-${String(nd).padStart(2, "0")}`);
    else onChange("");
  };
  const days = Array.from({ length: 31 }, (_, i) => i + 1);
  // ปี พ.ศ. ต้องเป็นรายการให้เลือก ห้ามให้พิมพ์เอง
  // เดิมเป็น <input type="number"> แล้ว commit ทุกครั้งที่กด ทำให้ปีที่พิมพ์ค้างกลางคัน
  // เช่น "2" ถูก padStart เป็น "0002" แล้วส่งกลับมาทับช่องที่กำลังพิมพ์
  // และเมื่อพิมพ์เกิน 4 หลัก สตริงจะไม่ผ่านรูปแบบ YYYY-MM-DD ทำให้ทั้งวันและเดือนที่กรอกไว้หายไปด้วย
  const nowBE = Number(todayBE.slice(0, 4));
  const years = [];
  for (let yy = nowBE + 10; yy >= nowBE - 10; yy--) years.push(yy);
  // เอกสารเก่าที่ปีอยู่นอกช่วง ต้องเติมกลับเข้ารายการ ไม่งั้นค่าที่บันทึกไว้จะหายตอนเปิดแก้ไข
  if (y && years.indexOf(Number(y)) < 0) { years.push(Number(y)); years.sort((a, b) => b - a); }
  const sel = { ...inp, padding: "8px 6px", cursor: "pointer" };
  return (
    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
      <select value={d ? Number(d) : ""} onChange={e => commit(y, mo, e.target.value)} style={{ ...sel, flex: "0 0 58px" }}>
        <option value="">วัน</option>
        {days.map(dd => <option key={dd} value={dd}>{dd}</option>)}
      </select>
      <select value={mo ? Number(mo) : ""} onChange={e => commit(y, e.target.value, d)} style={{ ...sel, flex: "1 1 84px" }}>
        <option value="">เดือน</option>
        {thMonthFull.map((label, i) => <option key={i} value={i + 1}>{label}</option>)}
      </select>
      <select value={y ? Number(y) : ""} onChange={e => commit(e.target.value, mo, d)} style={{ ...sel, flex: "0 0 84px" }}>
        <option value="">พ.ศ.</option>
        {years.map(yy => <option key={yy} value={yy}>{yy}</option>)}
      </select>
      {value && <button type="button" onClick={() => commit("", "", "")} title="ล้างวันที่" style={{ border: "none", background: "transparent", color: C.red, fontSize: 13, cursor: "pointer", padding: "0 2px", flexShrink: 0 }}>✕</button>}
    </div>
  );
}

function SyncBadge({ sync, onRetry, canForce }) {
  const map = {
    idle:    { dot: "#C9D6EA", text: "พร้อม", spin: false },
    loading: { dot: "#6B97D4", text: "กำลังโหลด…", spin: true },
    saving:  { dot: "#C77800", text: "กำลังบันทึก…", spin: true },
    ok:      { dot: "#2ECC71", text: "ซิงค์แล้ว", spin: false },
    error:   { dot: "#E74C3C", text: "บันทึกไม่สำเร็จ", spin: false },
    offline: { dot: "#95A5A6", text: "ยังไม่เชื่อมต่อ", spin: false },
  };
  const s = map[sync.status] || map.idle;
  const showRetry = canForce && (sync.status === "error" || sync.status === "ok" || sync.status === "offline");
  return (
    <div title={sync.msg || ""} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "rgba(255,255,255,.12)", border: "1px solid rgba(255,255,255,.2)", padding: "5px 10px", borderRadius: 8, fontSize: 11.5, fontWeight: 600, color: "#fff" }}>
      <span style={{ width: 8, height: 8, borderRadius: "50%", background: s.dot, boxShadow: s.spin ? `0 0 0 0 ${s.dot}` : "none", animation: s.spin ? "pulse 1s ease-in-out infinite" : "none" }} />
      <span>{s.text}</span>
      {showRetry && <button onClick={onRetry} style={{ border: "none", background: "rgba(255,255,255,.18)", color: "#fff", fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 6, cursor: "pointer", marginLeft: 2 }}>ซิงค์ตอนนี้</button>}
      <style>{`@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}`}</style>
    </div>
  );
}

      <div style={{ width: "100%", maxWidth: 460, background: "#fff", borderRadius: 20, padding: 28, boxShadow: "0 24px 60px rgba(0,0,0,.35)", textAlign: "center" }}>

            : <>ยังไม่ได้ตั้งค่า <b>SYNC_URL</b> ในไฟล์ index.html<br />ให้ Deploy ไฟล์ Code.gs เป็น Web App แล้วนำ URL ที่ลงท้ายด้วย /exec มาใส่แทนคำว่า PASTE_APPS_SCRIPT_WEB_APP_URL_HERE</>}
        </div>

        <button onClick={onLogout} style={{ width: "100%", border: `1px solid ${C.line}`, background: "#fff", color: C.slate, fontWeight: 700, fontSize: 13.5, padding: "11px 16px", borderRadius: 12, cursor: "pointer" }}>ออกจากระบบ</button>

function LoginScreen({ project, users, onLogin }) {
  const [user, setUser] = useState("");
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");

  const tryLogin = () => {
    const u = (users || []).find(x => x.username.trim().toLowerCase() === user.trim().toLowerCase() && x.password === pwd);
    if (u) { onLogin(["admin", "dc", "team", "owner"].includes(u.role) ? u.role : "dc"); }
    else { setErr("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"); }
  };

  return (
    <div style={{ fontFamily: "'Inter','Segoe UI','Sukhumvit Set',system-ui,sans-serif", minHeight: "100vh", background: `linear-gradient(135deg,${C.ink} 0%,${C.steel} 55%,${C.blue} 100%)`, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <style>{`* { box-sizing: border-box; }`}</style>
      <div style={{ width: "100%", maxWidth: 420 }}>
        {/* Brand */}
        <div style={{ textAlign: "center", marginBottom: 26 }}>
          <div style={{ display: "flex", gap: 12, justifyContent: "center", marginBottom: 18 }}>
            <LogoSeal src={project.logoLeft} alt="logo left" pad={4} />
            <LogoSeal src={project.logoRight} alt="logo right" pad={9} />
          </div>
          <div style={{ fontSize: 26, fontWeight: 800, color: "#fff", letterSpacing: -0.4 }}>{project.nameEn}</div>
          <div style={{ fontSize: 13, color: "#C9D6EA", marginTop: 4 }}>{joinParts(" · ", project.tagEn, project.nameTh)}</div>
        </div>

        <div style={{ background: "#fff", borderRadius: 20, padding: 28, boxShadow: "0 24px 60px rgba(0,0,0,.35)" }}>
          <div style={{ fontSize: 17, fontWeight: 800, color: C.ink, marginBottom: 4 }}>เข้าสู่ระบบ</div>
          <div style={{ fontSize: 12.5, color: C.sub, marginBottom: 20 }}>กรอกชื่อผู้ใช้และรหัสผ่านที่ได้รับจากผู้ดูแลระบบ</div>

          <label style={{ fontSize: 12, fontWeight: 700, color: C.slate, display: "block", marginBottom: 5 }}>ชื่อผู้ใช้</label>
          <input value={user} onChange={e => { setUser(e.target.value); setErr(""); }} placeholder="username" autoFocus
            style={{ ...inp, marginBottom: 14, padding: "11px 13px" }} />

          <label style={{ fontSize: 12, fontWeight: 700, color: C.slate, display: "block", marginBottom: 5 }}>รหัสผ่าน</label>
          <input type="password" value={pwd} onChange={e => { setPwd(e.target.value); setErr(""); }} onKeyDown={e => e.key === "Enter" && tryLogin()} placeholder="••••••••"
            style={{ ...inp, marginBottom: err ? 8 : 18, padding: "11px 13px" }} />

          {err && <div style={{ fontSize: 12, color: C.red, background: C.redBg, padding: "8px 12px", borderRadius: 8, marginBottom: 16 }}>⚠ {err}</div>}

          <button onClick={tryLogin} style={{ width: "100%", border: "none", background: C.blue, color: "#fff", fontWeight: 700, fontSize: 14.5, padding: "13px 16px", borderRadius: 12, cursor: "pointer" }}>เข้าสู่ระบบ</button>
          <div style={{ fontSize: 11.5, color: C.sub, textAlign: "center", marginTop: 12 }}>Admin · DC · ทีมงานผู้รับเหมา · เจ้าของงาน</div>
        </div>

        <div style={{ textAlign: "center", marginTop: 18, fontSize: 11, color: "rgba(255,255,255,.5)" }}>
          {joinParts(" · ", joinParts(" ", project.nameEn, project.tagEn), joinParts(" × ", project.owner, project.contractor))}
        </div>
      </div>
    </div>
  );
}
