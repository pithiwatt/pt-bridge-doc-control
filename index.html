// วันที่ปัจจุบันในรูปแบบ พ.ศ. YYYY-MM-DD — คำนวณจากนาฬิกาเครื่องผู้ใช้ทุกครั้งที่โหลดหน้า
// (เดิมเป็นค่าคงที่ ทำให้การนับ "เหลือ/เกินกำหนด X วัน" คลาดเคลื่อนตามเวลาที่ผ่านไป)
const todayBE = (() => {
  const d = new Date();
  return `${d.getFullYear() + 543}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
})();
const daysLeft = (target) => {
  if (!target || target === "—") return null;
  const toD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y - 543, m - 1, d); };
  return Math.round((toD(target) - toD(todayBE)) / 86400000);
};
const thMonth = { "01": "ม.ค.", "02": "ก.พ.", "03": "มี.ค.", "04": "เม.ย.", "05": "พ.ค.", "06": "มิ.ย.", "07": "ก.ค.", "08": "ส.ค.", "09": "ก.ย.", "10": "ต.ค.", "11": "พ.ย.", "12": "ธ.ค." };
// แสดงวันที่ พ.ศ. แบบย่อ เช่น "5 ก.ค. 69" จากค่า "2569-07-05"
const fmtBEShort = (s) => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return "—"; const [y, m, d] = s.split("-"); return `${Number(d)} ${thMonth[m] || m} ${y.slice(2)}`; };
const thMonthFull = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
// ต่อข้อความด้วยตัวคั่น โดยข้ามค่าว่าง — กันตัวคั่นค้างลอย (เช่น "Document Control ·")
// เมื่อข้อมูลโครงการบางช่องยังไม่ได้กรอก
const joinParts = (sep, ...parts) => parts.filter(p => p && String(p).trim()).join(sep);
const currentThaiDate = () => { const d = new Date(); return `${d.getDate()} ${thMonthFull[d.getMonth()]} ${d.getFullYear() + 543}`; };
// แปลงวันที่ทุกรูปแบบ -> "พ.ศ.-MM-DD" (รองรับค่าที่ Google Sheets เผลอแปลงเป็น date-time)
const _enMon = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };
function normalizeBE(s) {
  if (!s) return "";
  s = String(s).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;                    // พ.ศ.-MM-DD อยู่แล้ว
  let m = s.match(/\b([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})\b/);   // "Sun May 07 2569 ..."
  if (m && _enMon[m[1]]) {
    let y = parseInt(m[3], 10); if (y < 2400) y += 543;
    return `${y}-${String(_enMon[m[1]]).padStart(2, "0")}-${String(parseInt(m[2], 10)).padStart(2, "0")}`;
  }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})T/);                       // ISO "2026-05-07T..."
  if (m) { let y = parseInt(m[1], 10); if (y < 2400) y += 543; return `${y}-${m[2]}-${m[3]}`; }
  return s;
}

// ── ตัวกรองช่วงวันที่ทั่วทั้งระบบ ── อ้างอิง "วันที่ยื่น (submit)" หรือ "วันที่ตอบกลับ (response)"
// หมายเหตุ: Memo/Minutes ไม่มีวัน due แยก จึงใช้วัน "date" เดียวกันทั้งสองกรณี
const DATE_FIELD = {

  drawings:    { submit: "issued", response: "issued" }, // ไม่มีวันตอบกลับแยกของรายแผ่น ใช้วันยื่นชุด RFA

  outstanding: { submit: "found",  response: "resolvedDate" },
};

// เทียบวันที่แบบ พ.ศ. YYYY-MM-DD ตรง ๆ ได้เพราะ format คงที่ (string compare = date compare)
const inDateRange = (dateStr, from, to) => {
  if (!from && !to) return true;
  if (!dateStr || dateStr === "—") return false;
  const d = normalizeBE(dateStr);
  if (from && d < from) return false;
  if (to && d > to) return false;
  return true;
};

// ─────────────────────────────────────────────────────────────
// รายงานตามงวด (Weekly / Monthly / Safety)
// หลักการ: รายงานเหล่านี้นำส่งด้วย "หนังสือ" อยู่แล้ว จึงไม่สร้างทะเบียนซ้ำ
// แต่ติดป้าย reportType ไว้ที่หนังสือ แล้วให้แท็บ Report เป็นมุมมองกรองของทะเบียนหนังสือ
// (ทะเบียนเดียว = เลขที่เดียว สถานะเดียว ตรวจสอบย้อนกลับได้)
const REPORT_TYPES = [
  { code: "weekly", label: "รายงานประจำสัปดาห์", short: "รายสัปดาห์", unit: "week" },
  { code: "monthly", label: "รายงานประจำเดือน", short: "รายเดือน", unit: "month" },
  { code: "safety", label: "รายงานความปลอดภัย", short: "ความปลอดภัย", unit: "month" },
];
const reportTypeOf = (code) => REPORT_TYPES.find(r => r.code === code) || null;

// แปลง พ.ศ. YYYY-MM-DD -> Date object (ค.ศ.)
const beToDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y - 543, m - 1, d); };
// ── นิยาม "งวด" ของรายงาน ──
// ⚠ งวดของโครงการนี้ไม่ใช่สัปดาห์ปฏิทิน ISO (จันทร์–อาทิตย์) และไม่ผูกกับเลขสัปดาห์ของปี
// แต่แบ่งตาม "วันที่ในเดือน" เดือนละ 4 งวดตายตัว ตามระเบียบการนำส่งรายงานของโครงการ
const WEEK_SLOTS = [
  { i: 1, from: 1, to: 7 },
  { i: 2, from: 8, to: 15 },
  { i: 3, from: 16, to: 23 },
  { i: 4, from: 24, to: 31 },   // ถึงสิ้นเดือนจริง (28/29/30/31)
];
// จำนวนวันในเดือน พ.ศ. ที่กำหนด
const daysInMonthBE = (y, m) => new Date(y - 543, m, 0).getDate();

// รหัสงวด — สัปดาห์ = "2569-08-W2" · เดือน = "2569-08"
// (จงใจไม่มีฟังก์ชันแปลง "วันที่ -> งวด" เพราะงวดต้องมาจากที่ผู้ใช้เลือกเท่านั้น
//  หนังสือนำส่งหลังจบงวดเสมอ การเดาจากวันที่จะได้งวดถัดไปทุกครั้ง)
// ช่วงวันที่จริงของงวด (ใช้แสดงผล และใช้ตัดงวดที่อยู่นอกช่วงสัญญา)
const periodRange = (key, unit) => {
  if (!key) return null;
  const p = key.split("-");
  const y = Number(p[0]), m = Number(p[1]);
  if (!y || !m) return null;
  const mm = String(m).padStart(2, "0");
  const last = daysInMonthBE(y, m);
  if (unit === "month") return { from: `${y}-${mm}-01`, to: `${y}-${mm}-${String(last).padStart(2, "0")}` };
  const slot = WEEK_SLOTS[Number((p[2] || "W1").slice(1)) - 1] || WEEK_SLOTS[0];
  return {
    from: `${y}-${mm}-${String(slot.from).padStart(2, "0")}`,
    to: `${y}-${mm}-${String(Math.min(slot.to, last)).padStart(2, "0")}`,
  };
};
// ไล่รหัสงวดทั้งหมดในช่วง fromBE..toBE (เรียงเก่า→ใหม่)
// ตัดงวดที่ไม่ทับช่วงจริงออก เช่น เริ่มงาน 10 ส.ค. งวด 1–7 ส.ค. ย่อมไม่มีอยู่
const periodsBetween = (fromBE, toBE, unit) => {
  if (!fromBE || !toBE || fromBE > toBE) return [];
  const out = [];
  let [y, m] = fromBE.split("-").map(Number);
  const [ey, em] = toBE.split("-").map(Number);
  let guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard++ < 400) {
    const mm = String(m).padStart(2, "0");
    if (unit === "month") out.push(`${y}-${mm}`);
    else WEEK_SLOTS.forEach(s => out.push(`${y}-${mm}-W${s.i}`));
    if (++m > 12) { m = 1; y++; }
  }
  return out.filter(k => { const r = periodRange(k, unit); return r && r.to >= fromBE && r.from <= toBE; });
};
// ป้ายกำกับงวด — seq คือลำดับที่นับต่อเนื่องตั้งแต่วันเริ่มปฏิบัติงานของโครงการ
// (ไม่ใช่เลขสัปดาห์ของปฏิทินปี เพราะผู้ใช้อ้างอิง "รายงานฉบับที่เท่าไรของโครงการ")
const periodLabel = (key, unit, seq) => {
  if (!key) return "—";
  const r = periodRange(key, unit);
  if (!r) return "—";
  const n = seq ? (unit === "month" ? `เดือนที่ ${seq}` : `สัปดาห์ที่ ${seq}`) : "";
  if (unit === "month") {
    const [y, m] = key.split("-");
    const mLabel = `${thMonth[m] || m} ${y.slice(2)}`;
    return n ? `${n} · ${mLabel}` : mLabel;
  }
  const span = `${Number(r.from.split("-")[2])}–${fmtBEShort(r.to)}`;
  return n ? `${n} · ${span}` : span;
};
// ตัวเลือก "งวดที่รายงาน" สำหรับฟอร์มหนังสือ
// ลำดับงวดนับจากต้นสัญญาเสมอ เพื่อให้เลขตรงกับที่แสดงในแท็บ Report
// แต่แสดงเฉพาะงวดที่ถึงกำหนดแล้ว (เผื่ออีก 1 งวดสำหรับนำส่งล่วงหน้า) เพราะสัญญา 900 วัน
// มีงวดรายสัปดาห์ร้อยกว่างวด ถ้าโชว์หมดจะเลื่อนหาลำบาก · เรียงงวดใหม่ไว้บนสุด
const reportPeriodOptions = (project, reportCode, current) => {
  const rt = reportTypeOf(reportCode);
  const start = project && project.startDate;
  if (!rt || !start) return [];
  const all = periodsBetween(start, (project.endDate || todayBE), rt.unit);
  const seqOf = {};
  all.forEach((k, i) => { seqOf[k] = i + 1; });
  const due = all.filter(k => { const r = periodRange(k, rt.unit); return r && r.from <= todayBE; });
  if (all[due.length]) due.push(all[due.length]);
  // ค่าที่บันทึกไว้ต้องมีในรายการเสมอ ไม่งั้นเปิดแก้ไขแล้วงวดเดิมจะหายไปเงียบ ๆ
  if (current && due.indexOf(current) < 0) due.push(current);
  return due.reverse().map(k => ({ value: k, label: periodLabel(k, rt.unit, seqOf[k]) }));
};

// ไล่ "ทุกวัน" ในช่วง — ใช้หาวันที่ยังไม่มีบันทึก Daily
const daysBetween = (fromBE, toBE) => {
  if (!fromBE || !toBE || fromBE > toBE) return [];
  const out = [];
  let d = beToDate(fromBE);
  const end = beToDate(toBE);
  let guard = 0;
  while (d <= end && guard++ < 1200) {
    out.push(`${d.getFullYear() + 543}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`);
    d = new Date(d.getTime() + 86400000);
  }
  return out;
};

// ⚠ ต้องแก้ก่อนใช้งานจริง — วาง URL ของ Apps Script Web App (ลงท้ายด้วย /exec)
// วิธีได้มา: เปิด Google Sheet ของโครงการ → ส่วนขยาย → Apps Script → วาง Code.gs
//           → Deploy → New deployment → ประเภท "Web app"
//           → Execute as: Me · Who has access: Anyone → Deploy → คัดลอก Web app URL
// Google Sheet ของโครงการ:
// https://docs.google.com/spreadsheets/d/1IBsafP2imX9wxiGhOhRTh-45tfKtxYCw_vhE7LxAbBk/edit
const SYNC_URL = "https://script.google.com/macros/s/AKfycbzKoViIh_FzQLXCuMKzNYzyNVWKBJ8R1fC8COmdTYJRxd8-ONHtSdrX3izkAOZXBV49/exec";
// ⚠ ต้องตรงกับตัวแปร SECRET ใน Code.gs เป๊ะ ๆ (คนละตัวกับรหัสผ่าน admin)
const SYNC_SECRET = "PTBRIDGE-2569";

// true เมื่อ SYNC_URL ถูกตั้งค่าเป็น URL จริงแล้ว
// ถ้ายังเป็น placeholder ต้องตัดจบทันที ไม่งั้นการเรียกแต่ละครั้งจะค้างรอจน timeout 45 วินาที
// (และมี retry อีกรอบ) ทำให้หน้าเข้าสู่ระบบดูเหมือนแฮงก์ไปเฉย ๆ โดยไม่บอกสาเหตุ
const SYNC_READY = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(SYNC_URL);

// ── ค่าความทนทานของการเชื่อมต่อ ──
// วัดจากการยิงทดสอบ Apps Script ของโครงการนี้จริง (ส.ค. 2569):
//   · คำขอที่สำเร็จใช้เวลา 5–26 วินาที
//   · ราว 1 ใน 6 ของคำขอ Google ตอบหน้า 404 กลับมาแทน JSON แบบสุ่ม
//   · ⚠ เมื่อพลาด JSONP จะ "เงียบ" — ไม่มีทั้ง onerror และ onload ให้จับ
//     จึงรู้ตัวได้ทางเดียวคือรอจนครบ timeout เท่านั้น
// ดังนั้น timeout ที่ยาวเกินไปไม่ได้ช่วยให้สำเร็จมากขึ้น มีแต่ทำให้ผู้ใช้รอเก้อนานขึ้น
// 30 วินาทีจึงเผื่อจากที่วัดได้สูงสุด (26 วิ) พอสมควร แล้วรีบไปลองรอบใหม่แทน
var SYNC_TIMEOUT_MS = 30000;
var SYNC_ATTEMPTS = 3;   // ใช้กับ "การบันทึก" (POST) ซึ่งรู้ผลพลาดทันที จึงลองต่อคิวได้
// ── การโหลด (GET) ยิงพร้อมกันกี่คำขอต่อรอบ ──
// เพราะคำขอที่พลาดไม่ส่งสัญญาณอะไรกลับมาเลย การลองต่อคิวจึงต้องรอเก้อครบ 30 วิทุกครั้ง
// (ทดสอบจริงแล้วเจอกรณีรอถึง 66 วิกว่าจะสำเร็จในรอบที่สาม)
// ยิงสองคำขอพร้อมกันแล้วใช้อันที่ตอบก่อน จะได้ไม่ต้องรอตัวที่ค้าง — ปลอดภัยเพราะเป็นการ
// อ่านอย่างเดียว ไม่มีผลข้างเคียง ยิงซ้ำได้
var SYNC_PARALLEL = 2;
var SYNC_ROUNDS = 2;     // ถ้าพลาดทั้งคู่ ลองอีกรอบ รวมสูงสุด 4 คำขอ

// GET data from the Sheet. Returns parsed data or throws.
// opts.only === "users" : ขอเฉพาะรายชื่อผู้ใช้ (payload เล็กมาก) ใช้ตอนก่อนเข้าสู่ระบบ
// หมายเหตุเรื่องเวลา: ข้อมูลเต็มชุดมีโลโก้ base64 ฝังใน config ทำให้ตอบกลับเกือบ 100 KB
function sheetLoad(opts) {
  var only = (opts && opts.only) || "";
  return new Promise(function (resolve, reject) {
    if (!SYNC_READY) { reject(new Error("ยังไม่ได้ตั้งค่า SYNC_URL ในไฟล์ index.html")); return; }
    var cbName = "ptbridge_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    var script = document.createElement("script");
    var timer = setTimeout(function () { cleanup(); reject(new Error("timeout")); }, SYNC_TIMEOUT_MS);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function (resp) {
      cleanup();
      if (resp && resp.ok) resolve(resp.data);
      else reject(new Error((resp && resp.error) || "load failed"));
    };
    script.onerror = function () { cleanup(); reject(new Error("network")); };
    script.src = SYNC_URL + "?callback=" + cbName + (only ? "&only=" + only : "") + "&t=" + Date.now();
    document.body.appendChild(script);
  });
}
// คืนผลของคำขอแรกที่สำเร็จ และ reject ต่อเมื่อพลาดครบทุกอัน
// (เทียบเท่า Promise.any แต่เขียนเองเพื่อให้รองรับเบราว์เซอร์รุ่นเก่าที่ยังไม่มี)
function firstSuccess(list) {
  return new Promise(function (resolve, reject) {
    var left = list.length, lastErr = null;
    list.forEach(function (p) {
      p.then(resolve, function (e) {
        lastErr = e;
        if (--left === 0) reject(lastErr || new Error("load failed"));
      });
    });
  });
}
// โหลดข้อมูลแบบยิงคู่ขนาน ใช้ผลที่มาถึงก่อน ถ้าพลาดทั้งชุดค่อยขึ้นรอบใหม่
// จำเป็นเพราะ Apps Script ทั้งช้าเป็นครั้งคราว (cold start) และตอบ 404 แบบสุ่ม
function sheetLoadRetry(opts) {
  var round = 0;
  function go() {
    round++;
    var batch = [];
    for (var i = 0; i < SYNC_PARALLEL; i++) batch.push(sheetLoad(opts));
    return firstSuccess(batch).catch(function (err) {
      if (round >= SYNC_ROUNDS) throw err;
      // เว้นจังหวะสั้น ๆ เผื่อ Google ติดขัดชั่วขณะ จะได้ไม่ยิงซ้ำทันที
      return new Promise(function (r) { setTimeout(r, 700 * round); }).then(go);
    });
  }
  return go();
}
// POST a full snapshot. Apps Script ส่ง Access-Control-Allow-Origin: * มาเอง จึงอ่าน
// response จริงได้โดยไม่ต้องใช้ mode:"no-cors" (no-cors จะซ่อน error ฝั่ง backend ทั้งหมด
// ทำให้ดูเหมือนบันทึกสำเร็จแม้ Apps Script เขียนลง Sheet ไม่ได้จริง)
// ลองใหม่ได้อย่างปลอดภัย เพราะ payload เป็น snapshot เต็มชุดที่เขียนทับทั้งตาราง
// (idempotent) ส่งซ้ำกี่ครั้งผลลัพธ์ในชีตก็เหมือนเดิม ไม่เกิดรายการซ้ำ
async function sheetSave(snapshot) {
  if (!SYNC_READY) throw new Error("ยังไม่ได้ตั้งค่า SYNC_URL ในไฟล์ index.html");
  const body = JSON.stringify({ secret: SYNC_SECRET, data: snapshot });
  let lastErr;
  for (let attempt = 1; attempt <= SYNC_ATTEMPTS; attempt++) {
    try {
      const res = await fetch(SYNC_URL, {
        method: "POST", redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body,
      });
      // ตอนที่ Google ตอบหน้า 404 กลับมาแทน JSON บรรทัดนี้จะโยน error แล้วไปลองรอบใหม่
      const json = await res.json();
      if (json && json.ok) return json;
      // รหัสลับไม่ตรงคือตั้งค่าผิด ลองใหม่อีกกี่รอบก็ไม่หาย ต้องหยุดแล้วแจ้งทันที
      if (json && json.error === "unauthorized") throw new Error("unauthorized");
      lastErr = new Error((json && json.error) || "save failed");
    } catch (e) {
      if (e && e.message === "unauthorized") throw e;
      lastErr = e;
    }
    if (attempt < SYNC_ATTEMPTS) await new Promise(r => setTimeout(r, 700 * attempt));
  }
  throw lastErr;
}

    // 3. Overdue — items past their due date, still open, grouped by work type
    const overdueByWork = {};
    workCodes.forEach(w => overdueByWork[w] = { work: w, RFA: 0, RFI: 0, Issue: 0, total: 0 });
    rfaF.forEach(r => { if (["Submitted", "Under Review"].includes(r.status)) { const dl = daysLeft(r.due); if (dl != null && dl < 0 && overdueByWork[r.work]) { overdueByWork[r.work].RFA++; overdueByWork[r.work].total++; } } });
    rfiF.forEach(r => { if (r.status === "Pending Reply") { const dl = daysLeft(r.due); if (dl != null && dl < 0 && overdueByWork[r.work]) { overdueByWork[r.work].RFI++; overdueByWork[r.work].total++; } } });
    oiF.forEach(o => { if (o.status !== "Closed") { const dl = daysLeft(o.target); if (dl != null && dl < 0 && overdueByWork[o.work]) { overdueByWork[o.work].Issue++; overdueByWork[o.work].total++; } } });
    const overdueData = Object.values(overdueByWork).filter(d => d.total > 0).sort((a, b) => b.total - a.total);
    const overdueTotal = overdueData.reduce((s, d) => s + d.total, 0);

    // 4. Bottleneck — "รอใคร" : จัดกลุ่มตามผู้รับผิดชอบขั้นปัจจุบัน (field by) อ้างอิงจาก Settings
    const partyLabel = {}; (config.parties || []).forEach(p => { partyLabel[p.code] = p.label; });
    // อ้างอิงรหัสเจ้าของงาน/ผู้รับเหมาหลักจาก role ที่ตั้งค่าไว้ใน Settings (ไม่ผูกกับชื่อโครงการใดโครงการหนึ่ง)
    const ownerCode = (config.parties || []).find(p => p.role === "owner")?.code || "—";
    const contractorCode = (config.parties || []).find(p => p.role === "main_contractor")?.code || "—";
    const palette = [C.amber, C.red, C.blue, C.green, "#6C3483", "#0E7C7B", "#B9770E", "#5A6B82", "#A04000", "#1F618D"];
    const waitMap = {}; // code -> count
    const bump = (code) => { if (!code) code = "—"; waitMap[code] = (waitMap[code] || 0) + 1; };
    // RFA ที่ยังไม่จบ: รออนุมัติ = รอเจ้าของงานพิจารณา, ต้องแก้ไข = รอผู้รับเหมาหลักดำเนินการ
    rfaF.forEach(r => { if (["Submitted", "Under Review"].includes(r.status)) bump(ownerCode); else if (["Revise & Resubmit", "Rejected"].includes(r.status)) bump(contractorCode); });
    rfiF.forEach(r => { if (r.status === "Pending Reply") bump(ownerCode); });
    // Outstanding ที่ยังไม่ปิด: ใช้ field "by" (กำลังรอใคร) ตรงๆ
    oiF.forEach(o => { if (o.status !== "Closed") bump(o.by); });
    const bottleneckData = Object.keys(waitMap).map((code, i) => ({
      name: partyLabel[code] ? "รอ " + partyLabel[code] : (code === "—" ? "ยังไม่ระบุผู้รับผิดชอบ" : "รอ " + code),
      code, value: waitMap[code], color: palette[i % palette.length],
      desc: code === ownerCode ? "รอเจ้าของงานพิจารณา" : code === "—" ? "ควรระบุผู้รับผิดชอบในรายการ" : "อยู่ระหว่างดำเนินการ",
    })).sort((a, b) => b.value - a.value);
    const bottleneckTotal = bottleneckData.reduce((s, d) => s + d.value, 0);


    const filtered = rfaF.filter(r => {
      if (trendStatus === "All") return true;
      if (trendStatus === "Approved") return ["Approved", "Approved with Comment"].includes(r.status);
      if (trendStatus === "Pending") return ["Submitted", "Under Review"].includes(r.status);
      if (trendStatus === "Revise") return ["Revise & Resubmit", "Rejected"].includes(r.status);
      return true;
    });
    const monthMap = {};
    filtered.forEach(r => { const m = r.submit.slice(0, 7); if (!monthMap[m]) { monthMap[m] = { month: m }; catCodes.forEach(c => monthMap[m][c] = 0); } monthMap[m][r.cat] = (monthMap[m][r.cat] || 0) + 1; });
    const rfaMonthlyData = Object.values(monthMap).sort((a, b) => a.month.localeCompare(b.month)).map(d => ({ ...d, label: thMonth[d.month.slice(5)] + " " + d.month.slice(2, 4) }));

    return { rfaStatusData, rfaTotal, rfaApprovedPct, priorityData, oiTotal, rfaMonthlyData,
             agingBuckets, agingTotal, turnaroundData, overdueData, overdueTotal, bottleneckData, bottleneckTotal };
  }, [data, derivedDrawings, trendStatus, workCodes, catCodes, gWork, gCat, gDateFrom, gDateTo, gDateRef]);

  const matchQ = (obj) => !q || Object.values(obj).join(" ").toLowerCase().includes(q.toLowerCase());

  const tabs = [
    { id: "overview", label: "Overview", icon: "▦" },
    { id: "outstanding", label: "Outstanding", icon: "⚑", badge: stats.oiOpen },
    { id: "rfa", label: "RFA", icon: "✓", badge: stats.rfaPending },
    { id: "rfi", label: "RFI", icon: "?" },
    { id: "drawings", label: "Drawings", icon: "▧" },
    { id: "letters", label: "Letters", icon: "✉" },
    { id: "memos", label: "Memo", icon: "📝" },
    { id: "minutes", label: "Minutes", icon: "🗒" },
    { id: "report", label: "Report", icon: "📊" },
    ...(isEditor ? [{ id: "settings", label: "Settings", icon: "⚙" }] : []),
  ];

  const addRow = (key, row) => setData(d => ({ ...d, [key]: [...d[key], row] }));
  const updateRow = (key, idx, row) => setData(d => ({ ...d, [key]: d[key].map((r, i) => i === idx ? row : r) }));
  const deleteRow = (key, idx) => setData(d => ({ ...d, [key]: d[key].filter((_, i) => i !== idx) }));

  // count usages of a code/value across data (for delete protection)
  const countUsage = (predicate) => {
    let n = 0;
    data.outstanding.forEach(o => { if (predicate(o)) n++; });
    data.rfa.forEach(r => { if (predicate(r)) n++; });
    data.rfis.forEach(r => { if (predicate(r)) n++; });
    data.letters.forEach(l => { if (predicate(l)) n++; });
    data.memos.forEach(m => { if (predicate(m)) n++; });
    data.minutes.forEach(m => { if (predicate(m)) n++; });
    return n;
  };

  // ── SYNC: build a full snapshot of everything we persist ──
  const buildSnapshot = () => ({
    rfa: data.rfa, rfis: data.rfis, letters: data.letters,
    memos: data.memos, minutes: data.minutes, daily: data.daily,
    outstanding: data.outstanding, config: config,
  });

  // Pre-login: ดึง "เฉพาะรายชื่อผู้ใช้" จาก Sheet ก่อนแสดงหน้า Login
  // เพื่อให้ account ที่สร้างผ่าน Settings ใช้ login ได้ทันทีจากทุกเครื่อง
  // ใช้โหมด only=users เพราะข้อมูลเต็มชุดมีโลโก้ base64 ทำให้หนักเกือบ 100 KB และช้าราว 10 วินาที
  useEffect(() => {
    const fallback = setTimeout(() => setPreloaded(true), 30000); // กันค้างถ้า backend ไม่ตอบเลย
    sheetLoadRetry({ only: "users" }).then(remote => {
      if (remote && Array.isArray(remote.users) && remote.users.length) {
        setConfig(c => ({ ...c, users: remote.users }));
      }
    }).catch(() => {}).finally(() => {
      clearTimeout(fallback);
      setPreloaded(true);
    });
  }, []); // runs on mount, before login

  // โหลดข้อมูลจริงจาก Sheet — เรียกทั้งตอนเข้าสู่ระบบครั้งแรก และตอนกดปุ่ม "ลองใหม่"
  const loadFromSheet = () => {
    setFirstLoad("loading");
    setSync({ status: "loading", msg: "กำลังโหลดข้อมูลจาก Google Sheet", at: null });
    sheetLoadRetry().then(remote => {
      // ทำความสะอาดข้อมูลที่โหลดมา: แปลงวันที่ทุกรูปแบบให้เป็น พ.ศ. YYYY-MM-DD และลบคำว่า "undefined"
      const cleanRows = (arr, dateKeys) => (Array.isArray(arr) ? arr.map(r => {
        const o = { ...r };
        Object.keys(o).forEach(k => { if (o[k] === "undefined" || o[k] === "null" || o[k] == null) o[k] = ""; });
        (dateKeys || []).forEach(k => { if (o[k]) o[k] = normalizeBE(o[k]); });
        if (Array.isArray(o.sheetList)) o.sheetList = o.sheetList.map(s => { const ss = { ...s }; Object.keys(ss).forEach(k => { if (ss[k] === "undefined" || ss[k] === "null" || ss[k] == null) ss[k] = ""; }); return ss; });
        return o;
      }) : arr);
      const rRfa = cleanRows(remote.rfa, ["submit", "due", "responseDate"]);
      const rRfi = cleanRows(remote.rfis, ["sent", "due", "responseDate"]);
      const rLet = cleanRows(remote.letters, ["date", "due"]);
      const rMemo = cleanRows(remote.memos, ["date"]);
      const rMin = cleanRows(remote.minutes, ["date"]);
      const rDaily = cleanRows(remote.daily, ["date"]);
      const rOut = cleanRows(remote.outstanding, ["target", "found", "resolvedDate"]);
      setData(d => ({
        ...d,
        // ⚠ ห้ามใช้ "ถ้าว่างให้คงข้อมูลตัวอย่างไว้" เด็ดขาด
        // เพราะทะเบียนที่ยังไม่มีรายการจะถูกแทนที่ด้วยข้อมูลตัวอย่าง แล้ว auto-save
        // จะเขียนข้อมูลตัวอย่างนั้นลง Google Sheet จริงทันที
        // เมื่อโหลดสำเร็จแล้ว ให้ยึดข้อมูลจากชีตเป็นความจริงเสมอ แม้จะเป็นทะเบียนว่าง
        rfa: Array.isArray(rRfa) ? rRfa : [],
        rfis: Array.isArray(rRfi) ? rRfi : [],
        letters: Array.isArray(rLet) ? rLet : [],
        memos: Array.isArray(rMemo) ? rMemo : [],
        minutes: Array.isArray(rMin) ? rMin : [],
        daily: Array.isArray(rDaily) ? rDaily : [],
        outstanding: Array.isArray(rOut) ? rOut : [],
      }));
      if (remote.config) setConfig(c => ({ ...c, ...remote.config }));
      // ตั้งใจปล่อยช่วงวันที่กรองข้อมูลให้ว่างไว้ = แสดงทุกรายการ
      // (เดิมตั้งเป็นวันเริ่ม–วันสิ้นสุดโครงการ ทำให้รายการที่อยู่นอกช่วงสัญญาถูกซ่อนโดยที่ผู้ใช้ไม่รู้ตัว)
      // ผู้ใช้เลือกช่วงเองได้จากแถบตัวกรองเมื่อต้องการ
      setSync({ status: "ok", msg: "เชื่อมต่อและซิงค์ข้อมูลกับ Google Sheet เรียบร้อยแล้ว", at: new Date() });
      setFirstLoad("ok");
      setTimeout(() => { loadedOk.current = true; }, 300);
    }).catch(err => {
      // โหลดไม่สำเร็จ — ห้าม auto-save เด็ดขาด กันเขียนข้อมูลตัวอย่างทับของจริง
      loadedOk.current = false;
      setSync({ status: "offline", msg: "ยังไม่สามารถเชื่อมต่อกับ Google Sheet ได้", at: null });
      setFirstLoad("failed");
    });
  };

  // เข้าสู่ระบบแล้วโหลดข้อมูลจริงทันที (ครั้งเดียว)
  useEffect(() => {
    if (!role || didLoad.current) return;
    didLoad.current = true;
    loadFromSheet();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [role]);

  // Auto-save (admin only) — ทำงานเฉพาะเมื่อโหลดข้อมูลจริงเสร็จแล้ว (loadedOk)
  useEffect(() => {
    if (!isEditor || !loadedOk.current) return;
    if (sync.status === "loading") return;
    const snap = buildSnapshot();
    pendingSnap.current = snap;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      setSync(s => ({ ...s, status: "saving", msg: "กำลังบันทึกข้อมูลลง Google Sheet" }));
      sheetSave(pendingSnap.current)
        .then(() => setSync({ status: "ok", msg: "บันทึกข้อมูลลง Google Sheet เรียบร้อยแล้ว", at: new Date() }))
        .catch(() => setSync({ status: "error", msg: "บันทึกข้อมูลไม่สำเร็จ กรุณากดลองใหม่อีกครั้ง", at: null }));
    }, 1200);
    return () => saveTimer.current && clearTimeout(saveTimer.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data, config, isEditor]);

  const forceSync = () => {
    // กันเขียนทับ: ถ้ายังโหลดข้อมูลจริงไม่สำเร็จ ห้าม push snapshot ขึ้น Sheet
    if (!loadedOk.current) {
      setSync({ status: "offline", msg: "ยังไม่สามารถโหลดข้อมูลจาก Google Sheet ได้สำเร็จ กรุณารีเฟรชหน้าก่อนทำการซิงค์ข้อมูล เพื่อป้องกันข้อมูลซ้อนทับ", at: null });
      return;
    }
    setSync(s => ({ ...s, status: "saving", msg: "กำลังซิงค์ข้อมูล" }));
    sheetSave(buildSnapshot())
      .then(() => setSync({ status: "ok", msg: "ซิงค์ข้อมูลเรียบร้อยแล้ว", at: new Date() }))
      .catch(() => setSync({ status: "error", msg: "ซิงค์ข้อมูลไม่สำเร็จ กรุณากดลองใหม่อีกครั้ง", at: null }));
  };

  if (!role) {
    if (!preloaded) return <LoadingScreen project={config.project} msg="กำลังเตรียมระบบ" />;
    return <LoginScreen project={config.project} users={config.users || []} onLogin={setRole} />;
  }
  // ระหว่างรอข้อมูลจริง ห้ามแสดงข้อมูลตัวอย่างเด็ดขาด — ผู้ใช้อาจเข้าใจผิดว่าเป็นข้อมูลของโครงการ
  if (firstLoad === "loading") return <LoadingScreen project={config.project} msg="กำลังโหลดข้อมูลจาก Google Sheet" note="ใช้เวลาประมาณ 10 วินาที" />;
  if (firstLoad === "failed") return (
    <LoadFailedScreen project={config.project}
      onRetry={loadFromSheet}
      onDemo={() => setFirstLoad("demo")}
      onLogout={() => { setRole(null); didLoad.current = false; setFirstLoad("loading"); }} />
  );

  return (
    <div style={{ fontFamily: "'Inter','Segoe UI','Sukhumvit Set',system-ui,sans-serif", background: C.paper, minHeight: "100vh", color: C.ink }}>
      <style>{`
        *{box-sizing:border-box;}
        @media (max-width:760px){ .stat-grid{grid-template-columns:repeat(2,1fr)!important;} .hide-sm{display:none!important;} .two-col{grid-template-columns:1fr!important;} .chart-grid{grid-template-columns:1fr!important;} }
        .row-hover:hover{background:#F0F4FA!important;}
        ::-webkit-scrollbar{height:8px;width:8px;}::-webkit-scrollbar-thumb{background:#C5D0E0;border-radius:8px;}
        input,select,textarea{font-family:inherit;}
        .recharts-text{font-size:11px;}
        .dwg-link:hover{text-decoration:underline;}
      `}</style>

      <div style={{ background: `linear-gradient(120deg,${C.ink} 0%,${C.steel} 60%,${C.blue} 100%)`, color: "#fff", padding: "16px 26px 0" }}>
        <div style={{ maxWidth: 1600, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ display: "flex", gap: 10 }}>
                <LogoSeal src={config.project.logoLeft} alt="logo left" pad={4} />
                <LogoSeal src={config.project.logoRight} alt="logo right" pad={9} />
              </div>
              <div>
                <div style={{ fontSize: 11, letterSpacing: 2.5, color: C.sky, fontWeight: 600 }}>{joinParts(" · ", config.project.owner, config.project.contractor)}</div>
                <div style={{ fontSize: 23, fontWeight: 800, letterSpacing: -0.4, lineHeight: 1.15 }}>{config.project.nameEn} <span style={{ fontWeight: 300, opacity: .8 }}>{config.project.tagEn}</span></div>
                <div style={{ fontSize: 12.5, color: "#C9D6EA", marginTop: 2 }}>{config.project.nameTh}</div>
              </div>
            </div>
            {/* flexGrow ทำให้กล่องนี้ยืดเต็มความกว้างเมื่อจอแคบจนถูกดันลงบรรทัดใหม่
                ถ้าไม่ใส่ กล่องจะกว้างเท่าเนื้อหาแล้วไปกองชิดซ้ายของบรรทัด แต่ข้อความข้างในยังชิดขวาของกล่อง
                ผลคือข้อความไปลอยอยู่กลางจอโดยไม่อิงขอบไหนเลย (วัดจริงที่จอ 800px เหลือที่ว่างทางขวา 422px)
                เมื่อยืดเต็มบรรทัดแล้ว ข้อความและปุ่มจะชิดขวาจริง ตรงแนวเดียวกับตอนจอกว้าง */}
            <div style={{ textAlign: "right", flexGrow: 1 }}>
              <div className="hide-sm" style={{ fontSize: 12, color: "#C9D6EA", lineHeight: 1.7 }}>
                {(config.project.budget || config.project.duration) && (
                  <div>
                    {config.project.budget && <>วงเงิน <b style={{ color: "#fff" }}>{config.project.budget}</b></>}
                    {config.project.budget && config.project.duration && " · "}
                    {config.project.duration && <b style={{ color: "#fff" }}>{config.project.duration}</b>}
                  </div>
                )}
                {(config.project.startDate || config.project.endDate) && <div>ระยะเวลาโครงการ <b style={{ color: "#fff" }}>{fmtBEShort(config.project.startDate)} – {fmtBEShort(config.project.endDate)}</b></div>}
                <div style={{ marginTop: 2, fontSize: 11, opacity: .8 }}>ข้อมูล ณ {currentThaiDate()}</div>
              </div>
              <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "flex-end", alignItems: "center" }}>
                <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: isEditor ? "rgba(26,122,74,.25)" : "rgba(255,255,255,.12)", border: `1px solid ${isEditor ? "rgba(46,204,113,.4)" : "rgba(255,255,255,.2)"}`, padding: "4px 10px", borderRadius: 20, fontSize: 11.5, fontWeight: 600, color: "#fff" }}>
                  <span style={{ width: 7, height: 7, borderRadius: "50%", background: isEditor ? "#2ECC71" : "#C9D6EA" }} />
                  {role === "admin" ? "Admin" : role === "dc" ? "DC · กรอก/แก้ไขได้" : role === "team" ? "ทีมงานผู้รับเหมา · อ่านอย่างเดียว" : "เจ้าของงาน · อ่านอย่างเดียว"}
                </div>
                <SyncBadge sync={sync} onRetry={forceSync} canForce={isEditor} />
                <button onClick={() => { setRole(null); setTab("overview"); }} style={{ border: "1px solid rgba(255,255,255,.25)", background: "transparent", color: "#C9D6EA", fontSize: 11.5, fontWeight: 600, padding: "5px 12px", borderRadius: 8, cursor: "pointer" }}>ออกจากระบบ</button>
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 2, marginTop: 14, flexWrap: "wrap" }}>
            {tabs.map(t => {
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => switchTab(t.id)} style={{ border: "none", cursor: "pointer", padding: "11px 16px", background: active ? C.paper : "transparent", color: active ? C.ink : "#C9D6EA", fontWeight: active ? 700 : 500, fontSize: 13.5, borderRadius: "10px 10px 0 0", display: "flex", alignItems: "center", gap: 7, transition: "all .15s", marginLeft: t.id === "settings" ? "auto" : 0 }}>
                  <span style={{ opacity: .7 }}>{t.icon}</span>{t.label}
                  {t.badge ? <span style={{ background: C.red, color: "#fff", fontSize: 11, fontWeight: 700, borderRadius: 10, padding: "1px 7px" }}>{t.badge}</span> : null}
                </button>
              );
            })}
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1600, margin: "0 auto", padding: "24px 26px 60px" }}>
        {firstLoad === "demo" && (
          <div style={{ background: C.redBg, border: `1px solid ${C.red}55`, borderRadius: 12, padding: "13px 18px", marginBottom: 18, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
            <span style={{ fontSize: 18 }}>⚠</span>

                      <Td mono bold>{m.no}</Td><Td>{m.subject}</Td><Td center sub>{m.date && m.date !== "—" ? m.date.slice(5) : "—"}</Td><Td center><WorkTag w={m.from} /></Td><Td center><WorkTag w={m.to} /></Td>
                      <Td><Pill text={m.status} bg={ss.bg} fg={ss.fg} /></Td>
                      <Td center><FileBtn file={m.fileLink} /></Td>
                      <Td center><RowActions show={isEditor} onEdit={() => setModal({ kind: "memos", index: idx })} onDel={() => { if (confirm("ลบ?")) { deleteRow("memos", idx); flash("ลบแล้ว"); } }} /></Td>
                    </tr>); })}
                </tbody></table>
              </div>
            </Panel>
          );
        })()}

        {tab === "minutes" && (() => {
          const attendCodes = (m) => String(m.attendees || "").split(",").map(c => c.trim()).filter(Boolean);
          const toggleAttend = (code) => setFAttend(arr => arr.includes(code) ? arr.filter(c => c !== code) : [...arr, code]);
          // เจ้าของงาน (role === "owner") จะไม่เห็นบันทึกการประชุมที่ตั้งเป็น "ภายใน" (scope === "internal")
          const visibleMinutes = role === "owner" ? data.minutes.filter(m => m.scope !== "internal") : data.minutes;
          // เลือกได้หลายหน่วยงาน — แสดงเฉพาะการประชุมที่มีหน่วยงานที่เลือกไว้เข้าร่วมครบทุกหน่วยงาน (เงื่อนไข "และ")
          const rows = applySort(visibleMinutes.map((m, idx) => ({ m, idx })).filter(({ m }) => (fStatus === "All" || m.status === fStatus) && (fAttend.length === 0 || fAttend.every(c => attendCodes(m).includes(c))) && inDateRange(m[dateFieldFor("minutes", gDateRef)], gDateFrom, gDateTo) && matchQ(m)), x => x.m);
          return (
            <Panel title="ทะเบียนบันทึกการประชุม (Minutes)" sub="บันทึกรายงานการประชุมโครงการ พร้อมลิงก์ไฟล์จาก Google Drive" onAdd={() => setModal({ kind: "minutes", index: null })} canEdit={isEditor}>
              {role === "owner" && <div style={{ padding: "10px 20px 0", fontSize: 12, color: C.sub }}>ℹ แสดงเฉพาะการประชุมที่เป็นทางการ — การประชุมภายในของผู้รับเหมาจะไม่ปรากฏในมุมมองนี้</div>}
              <FilterBar q={q} setQ={setQ} placeholder="ค้นหาจากเลขที่บันทึก เรื่อง หรือคำสำคัญ">
                <Select value={fStatus} onChange={setFStatus} options={["All", ...config.statuses.lt]} label="สถานะ" />
                <DateRangeFilter from={gDateFrom} to={gDateTo} onFrom={setGDateFrom} onTo={setGDateTo} ref_={gDateRef} onRef={setGDateRef} />
                <Count n={rows.length} total={visibleMinutes.length} />
              </FilterBar>
              <div style={{ padding: "10px 20px 0", display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <span style={{ fontSize: 12, color: C.sub, fontWeight: 600 }}>หน่วยงานที่เข้าร่วม (ต้องมีครบทุกหน่วยงานที่เลือก):</span>
                {partyCodes.map(code => (
                  <button key={code} onClick={() => toggleAttend(code)} style={{ border: `1px solid ${fAttend.includes(code) ? C.blue : C.line}`, background: fAttend.includes(code) ? C.blue : "#fff", color: fAttend.includes(code) ? "#fff" : C.slate, fontWeight: 700, fontSize: 11.5, padding: "5px 11px", borderRadius: 20, cursor: "pointer", fontFamily: "ui-monospace,monospace" }}>{code}</button>
                ))}
                {fAttend.length > 0 && <button onClick={() => setFAttend([])} style={{ border: "none", background: "transparent", color: C.red, fontSize: 12, cursor: "pointer", fontWeight: 600 }}>✕ ล้าง</button>}
              </div>
              <div style={{ overflowX: "auto", marginTop: 8 }}>
                <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 820 }}><tbody>
                  <SortHead sort={sort} onSort={toggleSort} cols={[{ label: "เลขที่บันทึก", key: "no" }, { label: "เรื่อง", key: "subject" }, { label: "วันที่ประชุม", key: "date", center: true }, { label: "ผู้เข้าร่วมประชุม" }, { label: "ลักษณะ", key: "scope", center: true }, { label: "สถานะ", key: "status" }, { label: "ไฟล์", center: true }, { label: "", center: true }]} />
                  {rows.length === 0 && <EmptyRow span={8} />}
                  {rows.map(({ m, idx }) => { const ss = statusStyle(m.status); return (
                    <tr key={idx} className="row-hover" style={{ borderBottom: `1px solid ${C.line}` }}>
                      <Td mono bold>{m.no}</Td>
                      <Td>{m.subject}</Td>
                      <Td center sub>{m.date && m.date !== "—" ? m.date.slice(5) : "—"}</Td>
                      <Td><div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>{attendCodes(m).map(c => <WorkTag key={c} w={c} />)}{attendCodes(m).length === 0 && <span style={{ color: C.sub, fontSize: 12 }}>—</span>}</div></Td>
                      <Td center>{m.scope === "internal" ? <Pill text="ภายใน" bg={C.amberBg} fg={C.amber} /> : <Pill text="ทางการ" bg={C.greenBg} fg={C.green} />}</Td>
                      <Td><Pill text={m.status} bg={ss.bg} fg={ss.fg} /></Td>
                      <Td center><FileBtn file={m.fileLink} /></Td>
                      <Td center><RowActions show={isEditor} onEdit={() => setModal({ kind: "minutes", index: idx })} onDel={() => { if (confirm("ลบ?")) { deleteRow("minutes", idx); flash("ลบแล้ว"); } }} /></Td>
                    </tr>); })}
                </tbody></table>
              </div>
            </Panel>
          );
        })()}

        {tab === "report" && (() => {
          // จำนวนรายการของแต่ละหมวดย่อย แสดงบนปุ่ม
          const repCounts = { daily: (data.daily || []).length };
          REPORT_TYPES.forEach(r => { repCounts[r.code] = data.letters.filter(l => l.reportType === r.code).length; });
          const subItems = [{ id: "daily", label: "Daily Report", icon: "📅" }, ...REPORT_TYPES.map(r => ({ id: r.code, label: r.label, icon: "📄" }))];
          const subBar = (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
              {subItems.map(it => {
                const on = repSub === it.id;
                return (
                  <button key={it.id} onClick={() => { setRepSub(it.id); resetFilters(); }}
                    style={{ border: `1px solid ${on ? C.blue : C.line}`, background: on ? C.blue : C.white, color: on ? "#fff" : C.slate, fontWeight: 700, fontSize: 13, padding: "9px 16px", borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", gap: 7 }}>
                    <span>{it.icon}</span>{it.label}
                    <span style={{ background: on ? "rgba(255,255,255,.22)" : C.paper, color: on ? "#fff" : C.sub, fontSize: 11, fontWeight: 700, padding: "1px 7px", borderRadius: 10, minWidth: 18, textAlign: "center" }}>{repCounts[it.id]}</span>
                  </button>
                );
              })}
            </div>
          );

          // ══ Daily Request / Daily Report — ไม่ได้นำส่งเป็นหนังสือ จึงมีทะเบียนของตัวเอง ══
          if (repSub === "daily") {
            const all = data.daily || [];
            const rows = applySort(all.map((r, idx) => ({ r, idx })).filter(({ r }) => inDateRange(r.date, gDateFrom, gDateTo) && matchQ(r)), x => x.r);
            // สถานะคำนวณจากลิงก์ที่กรอกไว้ ไม่ต้องกรอกเอง จึงไม่มีทางขัดกับข้อมูลจริง
            const dStat = (r) => {
              const subs = [r.reqSubmit, r.repSubmit].filter(Boolean).length;
              const resp = [r.reqResponse, r.repResponse].filter(Boolean).length;
              if (subs === 0) return { text: "ยังไม่นำส่ง", bg: C.redBg, fg: C.red };
              if (subs < 2) return { text: "นำส่งไม่ครบ", bg: C.amberBg, fg: C.amber };
              if (resp === 0) return { text: "รอตอบกลับ", bg: C.amberBg, fg: C.amber };
              if (resp < 2) return { text: "ตอบกลับบางส่วน", bg: C.amberBg, fg: C.amber };
              return { text: "ครบถ้วน", bg: C.greenBg, fg: C.green };
            };
            // วันที่ยังไม่มีบันทึกเลยในช่วงที่กรอง (ไม่ตรวจล่วงหน้าเกินวันนี้)
            const dates = all.map(r => r.date).filter(Boolean).sort();
            const gapFrom = gDateFrom || dates[0] || "";
            const gapTo = [gDateTo || todayBE, todayBE].sort()[0];
            const have = new Set(dates);
            const missingDays = gapFrom ? daysBetween(gapFrom, gapTo).filter(d => !have.has(d)) : [];
            return (
              <div>
                {subBar}
                <Panel title="รายงานและคำขอประจำวัน (Daily Request / Daily Report)"
                  sub="บันทึกการนำส่งและการตอบกลับรายวัน · 1 แถว = 1 วันปฏิบัติงาน · ไม่ได้นำส่งในรูปแบบหนังสือ"
                  onAdd={() => setModal({ kind: "daily", index: null })} canEdit={isEditor}>
                  <FilterBar q={q} setQ={setQ} placeholder="ค้นหาจากวันที่หรือหมายเหตุ">
                    <DateRangeFilter from={gDateFrom} to={gDateTo} onFrom={setGDateFrom} onTo={setGDateTo} ref_={gDateRef} onRef={setGDateRef} />
                    <Count n={rows.length} total={all.length} />
                  </FilterBar>
                  <GapNotice title="วันที่ยังไม่มีบันทึกรายงานประจำวัน" items={missingDays.map(d => fmtBEShort(d))}
                    okMsg={dates.length ? "มีบันทึกครบทุกวันในช่วงที่ตรวจสอบ" : ""} />
                  <div style={{ overflowX: "auto", marginTop: 8 }}>
                    <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 900 }}><tbody>
                      <SortHead sort={sort} onSort={toggleSort} cols={[{ label: "วันที่ปฏิบัติงาน", key: "date" }, { label: "Daily Request (ยื่น/ตอบ)", center: true }, { label: "Daily Report (ยื่น/ตอบ)", center: true }, { label: "สถานะ", center: true }, { label: "หมายเหตุ", key: "note" }, { label: "", center: true }]} />
                      {rows.length === 0 && <EmptyRow span={6} />}
                      {rows.map(({ r, idx }) => { const st = dStat(r); return (
                        <tr key={idx} className="row-hover" style={{ borderBottom: `1px solid ${C.line}` }}>
                          <Td mono bold>{fmtBEShort(r.date)}</Td>
                          <Td center><FilePair submit={r.reqSubmit} response={r.reqResponse} /></Td>
                          <Td center><FilePair submit={r.repSubmit} response={r.repResponse} /></Td>
                          <Td center><Pill text={st.text} bg={st.bg} fg={st.fg} /></Td>
                          <Td sub>{r.note || "—"}</Td>
                          <Td center><RowActions show={isEditor} onEdit={() => setModal({ kind: "daily", index: idx })} onDel={() => { if (confirm("ลบบันทึกของวันนี้?")) { deleteRow("daily", idx); flash("ลบแล้ว"); } }} /></Td>
                        </tr>); })}
                    </tbody></table>
                  </div>
                </Panel>
              </div>
            );
          }

          // ══ Weekly / Monthly / Safety — เป็นมุมมองกรองของทะเบียนหนังสือ ไม่ใช่ทะเบียนใหม่ ══
          const rt = reportTypeOf(repSub);
          const src = data.letters.map((l, idx) => ({ l, idx })).filter(({ l }) => l.reportType === repSub);
          const rows = applySort(src.filter(({ l }) => (fStatus === "All" || l.status === fStatus) && (fFrom === "All" || l.from === fFrom) && (fTo === "All" || l.to === fTo) && inDateRange(l[dateFieldFor("letters", gDateRef)], gDateFrom, gDateTo) && matchQ(l)), x => x.l);
          // ⚠ งวดต้องอ่านจากช่อง reportPeriod ที่ผู้ใช้เลือกไว้เท่านั้น ห้ามคำนวณจากวันที่บนหนังสือ
          // เพราะหนังสือนำส่งหลังจบงวดเสมอ (เช่น รายงานช่วง 1–7 ส.ค. ออกหนังสือวันที่ 10 ส.ค.)
          // ถ้าเดาจากวันที่ จะไปนับเป็นงวดถัดไปทุกครั้ง
          const letterDates = src.map(({ l }) => l.date).filter(Boolean).sort();
          const spanFrom = config.project.startDate || letterDates[0] || "";
          const spanTo = [config.project.endDate || todayBE, todayBE].sort()[0];
          // ลำดับงวดนับต่อเนื่องจากวันเริ่มปฏิบัติงาน — ไล่จนสุดสัญญาเพื่อให้เลขคงที่ไม่ขยับตามวันที่ปัจจุบัน
          const seqFrom = config.project.startDate || spanFrom;
          const seqTo = config.project.endDate || spanTo;
          const seqOf = {};
          periodsBetween(seqFrom, seqTo, rt.unit).forEach((k, i) => { seqOf[k] = i + 1; });
          const labelOf = (k) => periodLabel(k, rt.unit, seqOf[k]);
          const doneKeys = new Set(src.map(({ l }) => l.reportPeriod).filter(Boolean));
          const missingPeriods = spanFrom ? periodsBetween(spanFrom, spanTo, rt.unit).filter(k => !doneKeys.has(k)) : [];
          // หนังสือที่ยังไม่ได้ระบุงวด — ต้องเตือนแยก ไม่งั้นจะดูเหมือนงวดนั้นขาดส่งทั้งที่ส่งแล้ว
          const unsetCount = src.filter(({ l }) => !l.reportPeriod).length;
          return (
            <div>
              {subBar}
              <Panel title={`ทะเบียน${rt.label}`}
                sub={`นำส่งในรูปแบบหนังสือ — แสดงเฉพาะหนังสือที่ระบุประเภทรายงานเป็น "${rt.label}" ในทะเบียนหนังสือโต้ตอบ`}
                onAdd={() => setModal({ kind: "letters", index: null, preset: { reportType: repSub } })} canEdit={isEditor}>
                <div style={{ padding: "10px 20px 0", fontSize: 12, color: C.sub }}>
                  ℹ รายการในหน้านี้เป็นข้อมูลชุดเดียวกับแท็บ <b>Letters</b> — การเพิ่มหรือแก้ไขที่นี่จะบันทึกลงทะเบียนหนังสือโดยตรง ไม่มีการเก็บข้อมูลซ้ำซ้อน
                </div>
                <FilterBar q={q} setQ={setQ} placeholder="ค้นหาจากเลขที่หนังสือ เรื่อง หรือคำสำคัญ">
                  <Select value={fFrom} onChange={setFFrom} options={["All", ...partyCodes]} label="จาก" />
                  <Select value={fTo} onChange={setFTo} options={["All", ...partyCodes]} label="ถึง" />
                  <Select value={fStatus} onChange={setFStatus} options={["All", ...config.statuses.lt]} label="สถานะ" />
                  <DateRangeFilter from={gDateFrom} to={gDateTo} onFrom={setGDateFrom} onTo={setGDateTo} ref_={gDateRef} onRef={setGDateRef} />
                  <Count n={rows.length} total={src.length} />
                </FilterBar>
                {unsetCount > 0 && (
                  <div style={{ margin: "10px 20px 0", background: C.redBg, border: `1px solid ${C.red}55`, borderRadius: 10, padding: "10px 14px", fontSize: 12.5, color: C.red, fontWeight: 600 }}>
                    ⚠ มีหนังสือ {unsetCount} ฉบับที่ยังไม่ได้ระบุงวด — กรุณาเปิดแก้ไขแล้วเลือกงวดให้ครบ มิฉะนั้นงวดนั้นจะยังถูกนับว่ายังไม่ได้นำส่ง
                  </div>
                )}
                <GapNotice title={rt.unit === "week" ? "สัปดาห์ที่ยังไม่ได้นำส่งรายงาน" : "เดือนที่ยังไม่ได้นำส่งรายงาน"}
                  items={missingPeriods.map(labelOf)}
                  okMsg={src.length ? "นำส่งรายงานครบทุกงวดแล้ว" : ""} />
                <div style={{ overflowX: "auto", marginTop: 8 }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 940 }}><tbody>
                    <SortHead sort={sort} onSort={toggleSort} cols={[{ label: "เลขที่หนังสือ", key: "no" }, { label: "เรื่อง", key: "subject" }, { label: "วันที่", key: "date", center: true }, { label: "งวด", center: true }, { label: "จาก", key: "from", center: true }, { label: "ถึง", key: "to", center: true }, { label: "สถานะ", key: "status" }, { label: "Files (ยื่น/ตอบ)", center: true }, { label: "", center: true }]} />
                    {rows.length === 0 && <EmptyRow span={9} />}
                    {rows.map(({ l, idx }) => { const ss = statusStyle(l.status); return (
                      <tr key={idx} className="row-hover" style={{ borderBottom: `1px solid ${C.line}` }}>
                        <Td mono bold>{l.no}</Td>
                        <Td>{l.subject}</Td>
                        <Td center sub>{fmtBEShort(l.date)}</Td>
                        <Td center>{l.reportPeriod
                          ? <Pill text={labelOf(l.reportPeriod)} bg="#E4ECF7" fg={C.blue} />
                          : <Pill text="ยังไม่ระบุงวด" bg={C.redBg} fg={C.red} />}</Td>
                        <Td center><WorkTag w={l.from} /></Td><Td center><WorkTag w={l.to} /></Td>
                        <Td><Pill text={l.status} bg={ss.bg} fg={ss.fg} /></Td>
                        <Td center><FilePair submit={l.fileSubmit} response={l.fileResponse} /></Td>
                        <Td center><RowActions show={isEditor} onEdit={() => setModal({ kind: "letters", index: idx })} onDel={() => { if (confirm("ลบหนังสือฉบับนี้ออกจากทะเบียน?")) { deleteRow("letters", idx); flash("ลบแล้ว"); } }} /></Td>
                      </tr>); })}
                  </tbody></table>
                </div>
              </Panel>
            </div>
          );
        })()}

        {tab === "settings" && <SettingsTab config={config} setConfig={setConfig} countUsage={countUsage} flash={flash} isAdmin={isAdmin} />}

        <div style={{ textAlign: "center", marginTop: 30, fontSize: 11.5, color: C.sub }}>
          {joinParts(" · ", joinParts(" ", config.project.nameEn, config.project.tagEn), joinParts(" × ", config.project.owner, config.project.contractor))}
          <div style={{ marginTop: 4, fontSize: 11, color: sync.status === "ok" ? C.green : sync.status === "offline" ? C.sub : C.amber }}>
            {sync.status === "ok" ? "เชื่อมต่อกับ Google Sheet เรียบร้อยแล้ว ระบบจะบันทึกข้อมูลโดยอัตโนมัติ"
              : sync.status === "offline" ? "ไม่สามารถเชื่อมต่อเครือข่ายได้ในขณะนี้ กรุณาเปิดใช้งานผ่านระบบจริงเพื่อใช้งานได้ครบถ้วน"
              : sync.status === "error" ? "การบันทึกข้อมูลครั้งล่าสุดไม่สำเร็จ กรุณากดปุ่ม \"ซิงค์ตอนนี้\" ที่มุมขวาบนของหน้าจอ"
              : "เชื่อมต่อกับ Google Sheet แล้ว ข้อมูลจะถูกบันทึกโดยอัตโนมัติเมื่อมีการแก้ไข"}
          </div>
        </div>
      </div>

      {modal && <EditModal modal={modal} data={data} config={config} workCodes={workCodes} catCodes={catCodes} partyCodes={partyCodes} onClose={() => setModal(null)} onSave={(row) => { if (modal.index == null) { addRow(modal.kind, row); flash("เพิ่มรายการแล้ว"); } else { updateRow(modal.kind, modal.index, row); flash("บันทึกแล้ว"); } setModal(null); }} />}
      {sheetModal != null && <SheetModal rfa={data.rfa[sheetModal]} drwStatuses={config.statuses.drw} canEdit={isEditor} onClose={() => setSheetModal(null)} onSave={(sheets) => { updateRow("rfa", sheetModal, { ...data.rfa[sheetModal], sheetList: sheets }); flash("บันทึกรายแผ่นแล้ว"); setSheetModal(null); }} />}
      {toast && <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: C.ink, color: "#fff", padding: "11px 22px", borderRadius: 30, fontSize: 13.5, fontWeight: 600, boxShadow: "0 8px 24px rgba(0,0,0,.25)", zIndex: 100 }}>✓ {toast}</div>}
    </div>
  );
}

// ════════ SETTINGS TAB ════════
function UserEditor({ users, onChange, flash }) {
  const [draft, setDraft] = useState({ username: "", password: "", role: "dc" });
  const [show, setShow] = useState({});
  const add = () => {
    const un = draft.username.trim();
    if (!un || !draft.password) { flash("กรอกชื่อผู้ใช้และรหัสผ่าน"); return; }
    if (users.some(u => u.username.toLowerCase() === un.toLowerCase())) { flash("มีชื่อผู้ใช้นี้แล้ว"); return; }
    onChange([...users, { username: un, password: draft.password, role: draft.role }]);
    setDraft({ username: "", password: "", role: "dc" });
    flash("เพิ่มผู้ใช้แล้ว");
  };
  const update = (i, key, val) => onChange(users.map((u, idx) => idx === i ? { ...u, [key]: val } : u));
  const remove = (i) => {
    const u = users[i];
    if (u.role === "admin" && users.filter(x => x.role === "admin").length <= 1) { flash("ต้องมี Admin อย่างน้อย 1 คน"); return; }
    if (confirm("ลบผู้ใช้ " + u.username + " ?")) { onChange(users.filter((_, idx) => idx !== i)); flash("ลบผู้ใช้แล้ว"); }
  };
  return (
    <div>
      <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>ผู้ใช้งาน / รหัสผ่าน</div>
      <div style={{ fontSize: 12.5, color: C.sub, marginBottom: 16 }}>
        เพิ่ม / ลบ / เปลี่ยนรหัสผ่านผู้ใช้งาน — ทุก role ต้อง Login ด้วยชื่อผู้ใช้และรหัสผ่าน<br />
        <b>Admin</b> = ทำได้ทุกอย่าง รวมถึงตั้งค่าผู้ใช้งาน/รหัสผ่าน · <b>DC</b> = กรอก/แก้ไขข้อมูลได้ทุกแท็บ ยกเว้นตั้งค่าผู้ใช้งาน · <b>ทีมงานผู้รับเหมา</b> = ดูข้อมูลได้อย่างเดียว เห็นการประชุมทุกรายการรวมถึงภายใน · <b>เจ้าของงาน</b> = ดูข้อมูลได้อย่างเดียว ไม่เห็นการประชุมภายใน
      </div>

      <div style={{ background: C.amberBg, border: `1px solid ${C.amber}33`, borderRadius: 10, padding: "10px 14px", fontSize: 11.5, color: C.amber, marginBottom: 18, display: "flex", gap: 8 }}>
        <span>🔒</span><span>รหัสผ่านนี้เป็นด่านแบ่งสิทธิ์ระดับทีม ไม่ใช่ความปลอดภัยขั้นสูง — อย่าใช้รหัสเดียวกับบัญชีสำคัญอื่น และเปลี่ยนรหัสเมื่อมีคนออกจากทีม</span>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
        {users.map((u, i) => (
          <div key={i} style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 12px", background: C.paper }}>
            <input value={u.username} onChange={e => update(i, "username", e.target.value)} placeholder="username" style={{ ...inp, width: 140, padding: "8px 10px" }} />
            <div style={{ position: "relative", width: 160 }}>
              <input type={show[i] ? "text" : "password"} value={u.password} onChange={e => update(i, "password", e.target.value)} placeholder="password" style={{ ...inp, width: "100%", padding: "8px 30px 8px 10px" }} />
              <button onClick={() => setShow(s => ({ ...s, [i]: !s[i] }))} title="แสดง/ซ่อนรหัส" style={{ position: "absolute", right: 4, top: 4, border: "none", background: "transparent", cursor: "pointer", fontSize: 13 }}>{show[i] ? "🙈" : "👁"}</button>
            </div>
            <select value={u.role} onChange={e => update(i, "role", e.target.value)} style={{ ...inp, width: 200, padding: "8px 10px" }}>
              <option value="admin">Admin (ทุกอย่าง)</option>
              <option value="dc">DC (กรอก/แก้ไขข้อมูล)</option>
              <option value="team">ทีมงานผู้รับเหมา (อ่านอย่างเดียว)</option>
              <option value="owner">เจ้าของงาน (อ่านอย่างเดียว)</option>
            </select>
            <button onClick={() => remove(i)} style={{ marginLeft: "auto", border: "none", background: C.redBg, color: C.red, fontWeight: 700, fontSize: 12.5, padding: "8px 12px", borderRadius: 8, cursor: "pointer" }}>ลบ</button>
          </div>
        ))}
      </div>

      <div style={{ borderTop: `1px solid ${C.line}`, paddingTop: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: C.slate }}>+ เพิ่มผู้ใช้ใหม่</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <input value={draft.username} onChange={e => setDraft(d => ({ ...d, username: e.target.value }))} placeholder="ชื่อผู้ใช้ใหม่" style={{ ...inp, width: 140, padding: "8px 10px" }} />
          <input value={draft.password} onChange={e => setDraft(d => ({ ...d, password: e.target.value }))} placeholder="รหัสผ่าน" style={{ ...inp, width: 160, padding: "8px 10px" }} />
          <select value={draft.role} onChange={e => setDraft(d => ({ ...d, role: e.target.value }))} style={{ ...inp, width: 200, padding: "8px 10px" }}>
            <option value="dc">DC (กรอก/แก้ไขข้อมูล)</option>
            <option value="team">ทีมงานผู้รับเหมา (อ่านอย่างเดียว)</option>
            <option value="owner">เจ้าของงาน (อ่านอย่างเดียว)</option>
            <option value="admin">Admin (ทุกอย่าง)</option>
          </select>
          <button onClick={add} style={{ border: "none", background: C.blue, color: "#fff", fontWeight: 700, fontSize: 13, padding: "9px 18px", borderRadius: 8, cursor: "pointer" }}>เพิ่ม</button>
        </div>
      </div>
    </div>
  );
}

// editor for project info + logos
function ProjectEditor({ project, onChange, flash }) {
  const [p, setP] = useState({ ...project });
  const leftRef = useRef(null), rightRef = useRef(null);
  const set = (k, v) => setP(s => ({ ...s, [k]: v }));
  const pickLogo = (which, e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (!f.type.startsWith("image/")) { flash("กรุณาเลือกไฟล์รูปภาพ"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      // ย่อรูปให้เหลือสูงสุด 160px ก่อนเก็บเป็น base64 — โลโก้ต้นฉบับจากกล้อง/สแกนอาจ
      // ใหญ่หลาย MB ทำให้ config JSON ที่ส่งไปเก็บใน Google Sheet บวมเกินจำเป็น
      const img = new Image();
      img.onload = () => {
        const MAX = 160;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        set(which, canvas.toDataURL("image/png"));
      };
      img.onerror = () => set(which, reader.result); // เผื่อย่อไม่ได้ ใช้ของเดิมไปก่อน
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  };
  const save = () => { onChange(p); flash("บันทึกข้อมูลโครงการแล้ว"); };

  const fields = [
    { k: "nameEn", label: "ชื่อโครงการ (อังกฤษ)", ph: "PT BRIDGE" },
    { k: "tagEn", label: "คำต่อท้าย (อังกฤษ)", ph: "Document Control" },
    { k: "nameTh", label: "ชื่อ/คำบรรยาย (ไทย)", ph: "ทางต่างระดับจุดตัด...", full: true },
    { k: "owner", label: "เจ้าของงาน", ph: "กรมทางหลวงชนบท" },
    { k: "contractor", label: "ผู้รับเหมา", ph: "บริษัท ที.ดี.ดี. ก่อสร้าง จำกัด" },
    { k: "budget", label: "วงเงิน", ph: "390,075,000 บาท" },
    { k: "duration", label: "ระยะเวลา", ph: "900 วัน" },
  ];

  return (
    <div>
      <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>🏗 ข้อมูลโครงการ</div>
      <div style={{ fontSize: 11.5, color: C.sub, marginBottom: 16 }}>แก้ไขข้อมูลและโลโก้ที่แสดงในส่วนหัวของระบบ เมื่อกดบันทึกแล้วข้อมูลจะปรับปรุงให้เป็นปัจจุบันทันที</div>

      {/* Logo uploaders */}
      <div style={{ display: "flex", gap: 14, marginBottom: 20, flexWrap: "wrap" }}>
        {[{ k: "logoLeft", label: "โลโก้ซ้าย (เจ้าของงาน)", ref: leftRef }, { k: "logoRight", label: "โลโก้ขวา (ผู้รับเหมา)", ref: rightRef }].map(lg => (
          <div key={lg.k} style={{ flex: "1 1 200px", border: `1px solid ${C.line}`, borderRadius: 12, padding: 14, background: C.paper }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.slate, marginBottom: 10 }}>{lg.label}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ background: `linear-gradient(120deg,${C.ink},${C.steel})`, borderRadius: 12, padding: 8, display: "flex", alignItems: "center", justifyContent: "center", width: 64, height: 64, flexShrink: 0 }}>
                <div style={{ background: "#fff", borderRadius: "50%", width: 48, height: 48, display: "flex", alignItems: "center", justifyContent: "center", padding: 5 }}>
                  {p[lg.k] ? <img src={p[lg.k]} alt="" style={{ maxWidth: "100%", maxHeight: "100%", objectFit: "contain" }} /> : <span style={{ fontSize: 10, color: C.sub }}>—</span>}
                </div>
              </div>
              <div>
                <button onClick={() => lg.ref.current && lg.ref.current.click()} style={{ border: `1px solid ${C.blue}`, background: "#fff", color: C.blue, fontWeight: 600, fontSize: 12, padding: "7px 13px", borderRadius: 8, cursor: "pointer", display: "block", marginBottom: 6 }}>⬆ เปลี่ยนรูป</button>
                <input ref={lg.ref} type="file" accept="image/*" onChange={e => pickLogo(lg.k, e)} style={{ display: "none" }} />
                <div style={{ fontSize: 10.5, color: C.sub }}>PNG โปร่งใสจะดูดีที่สุด</div>
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Text fields */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        {fields.map(f => (
          <div key={f.k} style={{ gridColumn: f.full ? "1 / -1" : "auto" }}>
            <label style={{ fontSize: 12, fontWeight: 700, color: C.slate, display: "block", marginBottom: 5 }}>{f.label}</label>
            <input value={p[f.k] || ""} onChange={e => set(f.k, e.target.value)} placeholder={f.ph} style={inp} />
          </div>
        ))}
      </div>

      {/* Project dates — ใช้กำหนดช่วงวันที่เริ่มต้น-สิ้นสุดของแถบกรองข้อมูลทั่วทั้งระบบ */}
      <div style={{ marginTop: 18, fontWeight: 700, fontSize: 13, color: C.steel }}>ระยะเวลาโครงการ</div>
      <div style={{ fontSize: 11.5, color: C.sub, marginBottom: 10 }}>ใช้เป็นค่าเริ่มต้นของช่วงวันที่ในแถบกรองข้อมูล (Overview และทุกแท็บ)</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}>
        <div>
          <label style={{ fontSize: 12, fontWeight: 700, color: C.slate, display: "block", marginBottom: 5 }}>วันที่ลงนามสัญญา</label>
          <DateInput value={p.contractDate} onChange={v => set("contractDate", v)} />
        </div>
        <div>
          <label style={{ fontSize: 12, fontWeight: 700, color: C.slate, display: "block", marginBottom: 5 }}>วันที่เริ่มปฏิบัติงาน</label>
          <DateInput value={p.startDate} onChange={v => set("startDate", v)} />
        </div>
        <div>
          <label style={{ fontSize: 12, fontWeight: 700, color: C.slate, display: "block", marginBottom: 5 }}>วันสิ้นสุดสัญญา/โครงการ</label>
          <DateInput value={p.endDate} onChange={v => set("endDate", v)} />
        </div>
      </div>

      <div style={{ marginTop: 18, display: "flex", justifyContent: "flex-end", gap: 10 }}>
        <button onClick={() => { setP({ ...project }); flash("คืนค่าเดิม"); }} style={{ border: `1px solid ${C.line}`, background: "#fff", color: C.sub, fontWeight: 600, fontSize: 13, padding: "9px 18px", borderRadius: 9, cursor: "pointer" }}>คืนค่า</button>
        <button onClick={save} style={{ border: "none", background: C.blue, color: "#fff", fontWeight: 700, fontSize: 13, padding: "9px 22px", borderRadius: 9, cursor: "pointer" }}>บันทึกข้อมูลโครงการ</button>
      </div>
    </div>
  );
}

// editor for [{code,label}] lists
// editor for parties (ผู้เกี่ยวข้อง) — แบ่งกลุ่มชัดเจนตามบทบาท: เจ้าของงาน / ผู้รับเหมาหลัก / ผู้รับเหมาย่อย
function PartyEditor({ items, roles, onChange, usage, flash }) {
  const [code, setCode] = useState(""); const [label, setLabel] = useState(""); const [role, setRole] = useState(roles[0].code);
  const add = () => {
    const c = code.trim().toUpperCase();
    if (!c) return;
    if (items.some(it => it.code === c)) { flash("รหัสนี้มีอยู่แล้ว"); return; }
    onChange([...items, { code: c, label: label.trim(), role }]); setCode(""); setLabel(""); flash("เพิ่มแล้ว");
  };
  const del = (idx) => {
    const it = items[idx];
    const u = usage(it.code);
    if (u > 0) { if (!confirm(`"${it.code}" ถูกใช้อยู่ ${u} รายการ — ถ้าลบ ข้อมูลเหล่านั้นจะอ้างถึงรหัสที่ไม่มีแล้ว\n\nยืนยันลบ?`)) return; }
    onChange(items.filter((_, i) => i !== idx)); flash("ลบแล้ว");
  };
  const updField = (idx, k, v) => onChange(items.map((it, i) => i === idx ? { ...it, [k]: v } : it));

  return (
    <div>
      <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>ผู้เกี่ยวข้อง</div>
      <div style={{ fontSize: 11.5, color: C.sub, marginBottom: 16 }}>ℹ จัดกลุ่มตามบทบาทในโครงการ ให้ชัดเจนว่าใครเป็นเจ้าของงาน ผู้รับเหมาหลัก หรือผู้รับเหมาย่อย — มีผลต่อ filter "กำลังรอใคร" และ dropdown จาก/ถึง ทั้งระบบ</div>
      {roles.map(r => {
        const rows = items.map((it, idx) => ({ it, idx })).filter(({ it }) => (it.role || roles[0].code) === r.code);
        return (
          <div key={r.code} style={{ marginBottom: 18 }}>
            <div style={{ fontWeight: 700, fontSize: 13, color: C.steel, marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: C.blue }} />{r.label}
              <span style={{ fontSize: 11, color: C.sub, fontWeight: 500 }}>({rows.length})</span>
            </div>
            <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 8 }}><tbody>
              {rows.length === 0 && <tr><td style={{ padding: "8px 10px", fontSize: 12, color: C.sub }}>— ยังไม่มี —</td></tr>}

function CodeEditor({ title, items, onChange, usage, flash, note, protectedCodes = [], codePh, labelPh }) {
  const [code, setCode] = useState(""); const [label, setLabel] = useState("");
  const add = () => {
    const c = code.trim().toUpperCase();
    if (!c) return;
    if (items.some(it => it.code === c)) { flash("รหัสนี้มีอยู่แล้ว"); return; }
    onChange([...items, { code: c, label: label.trim() }]); setCode(""); setLabel(""); flash("เพิ่มแล้ว");
  };
  const del = (idx) => {
    const it = items[idx];
    if (protectedCodes.includes(it.code)) { flash(`"${it.code}" เป็นรหัสระบบ ลบไม่ได้`); return; }
    const u = usage(it.code);
    if (u > 0) { if (!confirm(`"${it.code}" ถูกใช้อยู่ ${u} รายการ — ถ้าลบ ข้อมูลเหล่านั้นจะอ้างถึงรหัสที่ไม่มีแล้ว\n\nยืนยันลบ?`)) return; }
    onChange(items.filter((_, i) => i !== idx)); flash("ลบแล้ว");
  };
  const updLabel = (idx, v) => onChange(items.map((it, i) => i === idx ? { ...it, label: v } : it));

  return (
    <div>
      <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>{title}</div>
      {note && <div style={{ fontSize: 11.5, color: C.sub, marginBottom: 12 }}>ℹ {note}</div>}
      <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 14 }}><tbody>
        <tr style={{ background: C.paper }}>
          <th style={thS}>รหัส</th><th style={thS}>ชื่อเต็ม</th><th style={{ ...thS, width: 90, textAlign: "center" }}>ใช้อยู่</th><th style={{ ...thS, width: 50 }}></th>
        </tr>
        {items.map((it, idx) => { const u = usage(it.code); const prot = protectedCodes.includes(it.code); return (
          <tr key={idx} style={{ borderBottom: `1px solid ${C.line}` }}>
            <td style={{ padding: "8px 10px" }}><span style={{ fontFamily: "ui-monospace,monospace", fontWeight: 700, color: C.steel, fontSize: 13 }}>{it.code}</span>{prot && <span title="รหัสระบบ" style={{ marginLeft: 6, fontSize: 10, color: C.amber }}>🔒</span>}</td>
            <td style={{ padding: "8px 10px" }}><input value={it.label} onChange={e => updLabel(idx, e.target.value)} style={{ ...inp, fontSize: 12.5, padding: "6px 9px" }} /></td>
            <td style={{ padding: "8px 10px", textAlign: "center" }}>{u > 0 ? <span style={{ fontSize: 12, fontWeight: 700, color: u > 0 ? C.amber : C.sub, background: C.amberBg, padding: "2px 8px", borderRadius: 10 }}>{u}</span> : <span style={{ color: C.sub, fontSize: 12 }}>0</span>}</td>
            <td style={{ padding: "8px 10px", textAlign: "center" }}><button onClick={() => del(idx)} disabled={prot} style={{ border: "none", background: "transparent", color: prot ? "#C0C9D6" : C.red, cursor: prot ? "not-allowed" : "pointer", fontSize: 14 }}>🗑</button></td>
          </tr>
        ); })}
      </tbody></table>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", background: C.paper, padding: 12, borderRadius: 10 }}>
        <input value={code} onChange={e => setCode(e.target.value)} placeholder={codePh || "รหัส"} style={{ ...inp, width: 100, fontFamily: "ui-monospace,monospace", textTransform: "uppercase" }} />
        <input value={label} onChange={e => setLabel(e.target.value)} placeholder={labelPh || "ชื่อเต็ม"} style={{ ...inp, flex: 1, minWidth: 140 }} />
        <button onClick={add} style={{ border: "none", background: C.blue, color: "#fff", fontWeight: 700, fontSize: 13, padding: "9px 18px", borderRadius: 8, cursor: "pointer" }}>+ เพิ่ม</button>
      </div>
    </div>
  );
}

// editor for simple string lists
function ListEditor({ title, items, onChange, usage, flash, note, ph }) {
  const [val, setVal] = useState("");
  const add = () => { const v = val.trim(); if (!v) return; if (items.includes(v)) { flash("มีอยู่แล้ว"); return; } onChange([...items, v]); setVal(""); flash("เพิ่มแล้ว"); };
  const del = (idx) => { const it = items[idx]; const u = usage(it); if (u > 0) { if (!confirm(`"${it}" ถูกใช้อยู่ ${u} รายการ — ยืนยันลบ?`)) return; } onChange(items.filter((_, i) => i !== idx)); flash("ลบแล้ว"); };
  const move = (idx, dir) => { const j = idx + dir; if (j < 0 || j >= items.length) return; const arr = [...items];[arr[idx], arr[j]] = [arr[j], arr[idx]]; onChange(arr); };

  return (
    <div>
      <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>{title}</div>
      {note && <div style={{ fontSize: 11.5, color: C.sub, marginBottom: 12 }}>ℹ {note}</div>}
      <div style={{ marginBottom: 14 }}>
        {items.map((it, idx) => { const u = usage(it); return (
          <div key={idx} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderBottom: `1px solid ${C.line}` }}>
            <div style={{ display: "flex", flexDirection: "column" }}>
              <button onClick={() => move(idx, -1)} style={{ border: "none", background: "transparent", cursor: "pointer", color: C.sub, fontSize: 9, lineHeight: 1, padding: 0 }}>▲</button>
              <button onClick={() => move(idx, 1)} style={{ border: "none", background: "transparent", cursor: "pointer", color: C.sub, fontSize: 9, lineHeight: 1, padding: 0 }}>▼</button>
            </div>
            <span style={{ flex: 1, fontSize: 13, color: C.slate }}>{it}</span>
            {u > 0 && <span style={{ fontSize: 11.5, fontWeight: 700, color: C.amber, background: C.amberBg, padding: "2px 8px", borderRadius: 10 }}>ใช้ {u}</span>}
            <button onClick={() => del(idx)} style={{ border: "none", background: "transparent", color: C.red, cursor: "pointer", fontSize: 14 }}>🗑</button>
          </div>
        ); })}
      </div>
      <div style={{ display: "flex", gap: 8, background: C.paper, padding: 12, borderRadius: 10 }}>
        <input value={val} onChange={e => setVal(e.target.value)} onKeyDown={e => e.key === "Enter" && add()} placeholder={ph || "เพิ่มรายการใหม่"} style={{ ...inp, flex: 1 }} />
        <button onClick={add} style={{ border: "none", background: C.blue, color: "#fff", fontWeight: 700, fontSize: 13, padding: "9px 18px", borderRadius: 8, cursor: "pointer" }}>+ เพิ่ม</button>
      </div>
    </div>
  );
}

            {sheets.length === 0 && <tr><td colSpan={7} style={{ padding: "20px", textAlign: "center", color: C.sub, fontSize: 12.5 }}>ยังไม่มีแผ่นในชุดนี้ — กดเพิ่มแผ่นด้านล่าง</td></tr>}
          </tbody></table>
          {canEdit && <button onClick={add} style={{ marginTop: 12, border: `1px dashed ${C.blue}`, background: "#fff", color: C.blue, fontWeight: 600, fontSize: 12.5, padding: "8px 14px", borderRadius: 8, cursor: "pointer", width: "100%" }}>+ เพิ่มแผ่น</button>}
        </div>
        <div style={{ padding: "14px 22px", borderTop: `1px solid ${C.line}`, display: "flex", justifyContent: "flex-end", gap: 10, background: C.paper }}>
          <button onClick={onClose} style={{ border: `1px solid ${C.line}`, background: "#fff", color: C.sub, fontWeight: 600, fontSize: 13.5, padding: "9px 18px", borderRadius: 9, cursor: "pointer" }}>{canEdit ? "ยกเลิก" : "ปิด"}</button>
          {canEdit && <button onClick={() => onSave(sheets)} style={{ border: "none", background: C.blue, color: "#fff", fontWeight: 700, fontSize: 13.5, padding: "9px 22px", borderRadius: 9, cursor: "pointer" }}>บันทึกรายแผ่น</button>}
        </div>
      </div>
    </div>
  );
}

const TITLES = { outstanding: "Outstanding Issue", rfa: "RFA — ขออนุมัติ", rfis: "RFI — ขอข้อมูล", letters: "Letter", memos: "Memo", minutes: "Minutes — บันทึกการประชุม", daily: "Daily Request / Daily Report" };

function EditModal({ modal, data, config, workCodes, catCodes, partyCodes, onClose, onSave }) {
  const fields = buildFields(modal.kind, config, workCodes, catCodes, partyCodes);
  const existing = modal.index != null ? data[modal.kind][modal.index] : null;
  // ช่องแบบ select ที่ยังไม่มีตัวเลือกตายตัว (opts ว่าง เพราะคำนวณจากค่าอื่นในฟอร์ม) ต้องเริ่มที่ ""
  // ไม่งั้น f.opts[0] จะเป็น undefined แล้ว React จะเปลี่ยนช่องนั้นเป็น uncontrolled input
  const [form, setForm] = useState(() => { const init = {}; fields.forEach(f => { init[f.k] = existing ? (existing[f.k] ?? "") : (f.type === "select" && f.opts && f.opts.length ? (typeof f.opts[0] === "object" ? f.opts[0].value : f.opts[0]) : ""); }); if (modal.kind === "rfa") init.sheetList = existing ? (existing.sheetList || []) : []; if (!existing && modal.preset) Object.assign(init, modal.preset); return init; });
  const set = (k, v) => setForm(s => {
    const next = { ...s, [k]: v };
    // เปลี่ยนประเภทรายงานเมื่อไร งวดที่เลือกไว้เดิมใช้ไม่ได้ทันที
    // (รหัสงวดรายสัปดาห์ "2569-08-W2" คนละรูปแบบกับรายเดือน "2569-08" ถ้าค้างไว้จะแสดงผิด)
    if (k === "reportType") next.reportPeriod = "";
    return next;
  });
  const isEdit = modal.index != null;
  const fileRef = useRef(null);
  const onPickFile = (e) => { const f = e.target.files && e.target.files[0]; if (f) set("file", "uploaded:" + f.name); };
  const isSHD = modal.kind === "rfa" && form.cat === "SHD";
  const sheets = form.sheetList || [];
  const setSheets = (arr) => set("sheetList", arr);
  const addSheet = () => setSheets([...sheets, { no: "", title: "", rev: "A", status: (config.statuses.drw[1] || "Submitted"), file: "" }]);
  const updSheet = (i, k, v) => setSheets(sheets.map((s, j) => j === i ? { ...s, [k]: v } : s));
  const delSheet = (i) => setSheets(sheets.filter((_, j) => j !== i));
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(14,26,43,.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 90, padding: 20 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: 18, width: "100%", maxWidth: isSHD ? 760 : 580, maxHeight: "88vh", overflow: "hidden", display: "flex", flexDirection: "column", boxShadow: "0 24px 60px rgba(0,0,0,.3)" }}>
        <div style={{ padding: "18px 22px", borderBottom: `1px solid ${C.line}`, display: "flex", justifyContent: "space-between", alignItems: "center", background: `linear-gradient(120deg,${C.ink},${C.steel})`, color: "#fff" }}>
          <div><div style={{ fontSize: 12, color: C.sky, fontWeight: 600, letterSpacing: 1 }}>{isEdit ? "แก้ไขรายการ" : "เพิ่มรายการใหม่"}</div><div style={{ fontSize: 17, fontWeight: 800 }}>{TITLES[modal.kind]}</div></div>
          <button onClick={onClose} style={{ border: "none", background: "rgba(255,255,255,.15)", color: "#fff", width: 32, height: 32, borderRadius: 8, cursor: "pointer", fontSize: 16 }}>✕</button>
        </div>
        <div style={{ padding: "18px 22px", overflowY: "auto", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          {fields.filter(f => !f.showIf || f.showIf(form)).map(f => (
            <div key={f.k} style={{ gridColumn: (f.type === "textarea" || f.type === "file" || f.type === "multiselect") ? "1 / -1" : "auto" }}>
              <label style={{ fontSize: 12, fontWeight: 700, color: C.slate, display: "block", marginBottom: 5 }}>{f.label}</label>
              {f.type === "select" ? (
                <select value={form[f.k]} onChange={e => set(f.k, e.target.value)} style={inp}>
                  {(f.optsOf ? f.optsOf(form) : f.opts).map(o => { const v = typeof o === "object" ? o.value : o; const l = typeof o === "object" ? o.label : o; return <option key={v} value={v}>{l}</option>; })}
                </select>
              ) : f.type === "multiselect" ? (
                <div style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, background: C.paper, display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {f.opts.length === 0 && <span style={{ fontSize: 12, color: C.sub }}>ยังไม่มีรายชื่อผู้เกี่ยวข้องใน Settings</span>}
                  {f.opts.map(p => {
                    const codes = String(form[f.k] || "").split(",").map(c => c.trim()).filter(Boolean);
                    const checked = codes.includes(p.code);
                    const toggle = () => set(f.k, (checked ? codes.filter(c => c !== p.code) : [...codes, p.code]).join(","));
                    return (
                      <label key={p.code} style={{ display: "flex", alignItems: "center", gap: 6, border: `1px solid ${checked ? C.blue : C.line}`, background: checked ? "#E8EEF8" : "#fff", color: checked ? C.blue : C.slate, fontSize: 12.5, fontWeight: 600, padding: "6px 11px", borderRadius: 20, cursor: "pointer" }}>
                        <input type="checkbox" checked={checked} onChange={toggle} style={{ margin: 0 }} />{p.code} · {p.label}
                      </label>
                    );
                  })}
                </div>
              ) : f.type === "date" ? (
                <DateInput value={form[f.k]} onChange={v => set(f.k, v)} />
              ) : f.type === "textarea" ? (
                <textarea value={form[f.k]} onChange={e => set(f.k, e.target.value)} rows={2} placeholder={f.ph || ""} style={{ ...inp, resize: "vertical", lineHeight: 1.5 }} />
              ) : f.type === "file" ? (
                <div style={{ border: `1px dashed ${C.line}`, borderRadius: 10, padding: 12, background: C.paper }}>
                  <input value={form[f.k] && !String(form[f.k]).startsWith("uploaded:") ? form[f.k] : ""} onChange={e => set(f.k, e.target.value)} placeholder="วาง Google Drive link: https://drive.google.com/..." style={{ ...inp, marginBottom: 10 }} />
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <button onClick={() => fileRef.current && fileRef.current.click()} style={{ border: `1px solid ${C.blue}`, background: "#fff", color: C.blue, fontWeight: 600, fontSize: 12.5, padding: "8px 14px", borderRadius: 8, cursor: "pointer" }}>⬆ หรือ Upload ไฟล์</button>

                      <td style={{ padding: "6px 8px" }}><input value={s.title} onChange={e => updSheet(i, "title", e.target.value)} placeholder="ชื่อแบบ/รายละเอียดแผ่น" style={{ ...inp, fontSize: 12, padding: "7px 9px" }} /></td>

                      <td style={{ padding: "6px 8px", width: 124 }}><select value={s.status} onChange={e => updSheet(i, "status", e.target.value)} style={{ ...inp, fontSize: 11.5, padding: "7px 8px" }}>{config.statuses.drw.map(o => <option key={o} value={o}>{o}</option>)}</select></td>
                      <td style={{ padding: "6px 8px", width: 28 }}><button onClick={() => delSheet(i)} style={{ border: "none", background: "transparent", color: C.red, cursor: "pointer", fontSize: 14 }}>🗑</button></td>

                </tbody></table>

              <button onClick={addSheet} style={{ marginTop: 8, border: `1px dashed ${C.blue}`, background: "#fff", color: C.blue, fontWeight: 600, fontSize: 12.5, padding: "8px 14px", borderRadius: 8, cursor: "pointer", width: "100%" }}>+ เพิ่มแผ่น</button>
              <div style={{ fontSize: 10.5, color: C.sub, marginTop: 6 }}>💡 แนบไฟล์รายแผ่นเพิ่มเติมได้ภายหลังที่ปุ่ม "N แผ่น" ในตาราง RFA</div>
            </div>
          )}
        </div>
        <div style={{ padding: "14px 22px", borderTop: `1px solid ${C.line}`, display: "flex", justifyContent: "flex-end", gap: 10, background: C.paper }}>
          <button onClick={onClose} style={{ border: `1px solid ${C.line}`, background: "#fff", color: C.sub, fontWeight: 600, fontSize: 13.5, padding: "9px 18px", borderRadius: 9, cursor: "pointer" }}>ยกเลิก</button>
          <button onClick={() => onSave(form)} style={{ border: "none", background: C.blue, color: "#fff", fontWeight: 700, fontSize: 13.5, padding: "9px 22px", borderRadius: 9, cursor: "pointer" }}>{isEdit ? "บันทึก" : "เพิ่ม"}</button>
